name: self-contained smoke

# Start the emulator and its runner inside this job, execute a real workflow
# run on them, and record what the stack costs: start-up time, peak memory
# and CPU of the two processes.
on:
  push:
    branches: [ci-self-contained]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the emulator's Python dependencies
        id: deps
        run: |
          start=$(date +%s.%N)
          python3 -m venv /tmp/emu-venv
          /tmp/emu-venv/bin/pip install -q -r requirements.txt
          echo "seconds=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_OUTPUT"

      - name: Start the stack
        id: start
        env:
          CI_STACK_PYTHON: /tmp/emu-venv/bin/python
          CI_STACK_DIR: /tmp/ci-stack
        run: |
          start=$(date +%s.%N)
          scripts/ci-stack.sh start
          echo "seconds=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_OUTPUT"

      - name: Run a workflow on the emulator
        id: smoke
        run: |
          start=$(date +%s.%N)
          scripts/ci-workflow-smoke.sh
          echo "seconds=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_OUTPUT"

      - name: Record cost
        if: always()
        env:
          CI_STACK_DIR: /tmp/ci-stack
        run: |
          {
            echo "### Stack cost on $(nproc) vCPU, $(free -g | awk '/Mem:/ {print $2}') GiB"
            echo
            echo "| step | seconds |"
            echo "| --- | --- |"
            echo "| pip install | ${{ steps.deps.outputs.seconds }} |"
            echo "| stack start (until the API answers) | ${{ steps.start.outputs.seconds }} |"
            echo "| smoke (org, repo, push, dispatch, 2-job run) | ${{ steps.smoke.outputs.seconds }} |"
            echo
            echo '```'
            scripts/ci-stack.sh stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stack logs
        if: failure()
        run: tail -n 200 /tmp/ci-stack/emulator.log /tmp/ci-stack/runner.log

      - name: Stop the stack
        if: always()
        env:
          CI_STACK_DIR: /tmp/ci-stack
        run: scripts/ci-stack.sh stop

  # Which workflow features each runner executes. Informational: a feature
  # failing here is a finding, not a broken build.
  capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [python, upstream]
    env:
      CI_STACK_PYTHON: /tmp/emu-venv/bin/python
      CI_STACK_DIR: /tmp/ci-stack
      CI_STACK_RUNNERS: "2"
      CI_STACK_RUNNER_KIND: ${{ matrix.runner }}
      PROBE_WAIT_SECONDS: "180"
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv /tmp/emu-venv && /tmp/emu-venv/bin/pip install -q -r requirements.txt
      - name: Start the stack
        run: |
          start=$(date +%s.%N)
          scripts/ci-stack.sh start
          echo "start_seconds=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_ENV"
      - name: Probe
        run: |
          {
            echo "### ${{ matrix.runner }} runner x2 (stack start ${start_seconds}s)"
            echo
            scripts/ci-capability-probe.sh
            echo
            echo '```'
            scripts/ci-stack.sh stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stack logs
        if: always()
        run: tail -n 80 /tmp/ci-stack/*.log
      - name: Stop the stack
        if: always()
        run: scripts/ci-stack.sh stop
