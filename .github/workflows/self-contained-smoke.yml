name: self-contained smoke

# Start the emulator and its runner inside this job, execute a real workflow
# run on them, and record what the stack costs: start-up time, peak memory
# and CPU of the two processes.
on:
  push:
    branches: [ci-self-contained]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the emulator's Python dependencies
        id: deps
        run: |
          start=$(date +%s.%N)
          python3 -m venv /tmp/emu-venv
          /tmp/emu-venv/bin/pip install -q -r requirements.txt
          echo "seconds=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_OUTPUT"

      - name: Start the stack
        id: start
        env:
          CI_STACK_PYTHON: /tmp/emu-venv/bin/python
          CI_STACK_DIR: /tmp/ci-stack
        run: |
          start=$(date +%s.%N)
          scripts/ci-stack.sh start
          echo "seconds=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_OUTPUT"

      - name: Run a workflow on the emulator
        id: smoke
        run: |
          start=$(date +%s.%N)
          scripts/ci-workflow-smoke.sh
          echo "seconds=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_OUTPUT"

      - name: Record cost
        if: always()
        env:
          CI_STACK_DIR: /tmp/ci-stack
        run: |
          {
            echo "### Stack cost on $(nproc) vCPU, $(free -g | awk '/Mem:/ {print $2}') GiB"
            echo
            echo "| step | seconds |"
            echo "| --- | --- |"
            echo "| pip install | ${{ steps.deps.outputs.seconds }} |"
            echo "| stack start (until the API answers) | ${{ steps.start.outputs.seconds }} |"
            echo "| smoke (org, repo, push, dispatch, 2-job run) | ${{ steps.smoke.outputs.seconds }} |"
            echo
            echo '```'
            scripts/ci-stack.sh stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stack logs
        if: failure()
        run: tail -n 200 /tmp/ci-stack/emulator.log /tmp/ci-stack/runner.log

      - name: Stop the stack
        if: always()
        env:
          CI_STACK_DIR: /tmp/ci-stack
        run: scripts/ci-stack.sh stop

  # The packaging a consumer would use: the composite action, then the smoke
  # against its outputs. Step timings in the run show its start-up cost.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: emu
        uses: ./.github/actions/emulator
        with:
          runners: "2"
      - name: Run a workflow on the emulator
        env:
          EMU: ${{ steps.emu.outputs.url }}
        run: scripts/ci-workflow-smoke.sh

  # Which workflow features each runner executes. Informational: a feature
  # failing here is a finding, not a broken build.
  capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [python, upstream]
    env:
      CI_STACK_PYTHON: /tmp/emu-venv/bin/python
      CI_STACK_DIR: /tmp/ci-stack
      CI_STACK_RUNNERS: "2"
      CI_STACK_RUNNER_KIND: ${{ matrix.runner }}
      PROBE_WAIT_SECONDS: "180"
      PROBE_LOG_DIR: /tmp/ci-stack/probe-logs
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv /tmp/emu-venv && /tmp/emu-venv/bin/pip install -q -r requirements.txt
      # actions/runner drops the port from some emulator URLs and dials :80
      # (registration fails with "Connection refused (127.0.0.1:80)"), so
      # serve the emulator itself on 80 instead of adding a proxy process.
      - name: Serve on port 80 for the upstream runner
        if: matrix.runner == 'upstream'
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          echo "CI_STACK_PORT=80" >> "$GITHUB_ENV"
          echo "EMU=http://127.0.0.1:80" >> "$GITHUB_ENV"
      - name: Start the stack
        run: |
          start=$(date +%s.%N)
          scripts/ci-stack.sh start
          echo "start_seconds=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_ENV"
      - name: Probe
        run: |
          {
            echo "### ${{ matrix.runner }} runner x2 (stack start ${start_seconds}s)"
            echo
            scripts/ci-capability-probe.sh
            echo
            echo '```'
            scripts/ci-stack.sh stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stop the stack
        if: always()
        run: scripts/ci-stack.sh stop
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capabilities-${{ matrix.runner }}
          path: |
            /tmp/ci-stack/*.log
            /tmp/ci-stack/probe-logs
            /tmp/ci-stack/runner-*/_diag/*.log
